name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping nébula (acorda e mantém viva a instância)
        run: |
          curl -sS -o /dev/null -w "health: HTTP %{http_code} em %{time_total}s\n" \
            --max-time 100 https://nebula-u6uv.onrender.com/health
