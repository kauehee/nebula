services:
  - type: web
    name: nebula
    runtime: node
    plan: free
    buildCommand: YOUTUBE_DL_SKIP_PYTHON_CHECK=1 npm install && (python3 -m pip install --quiet curl_cffi || true)
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: YOUTUBE_DL_SKIP_PYTHON_CHECK
        value: "1"
